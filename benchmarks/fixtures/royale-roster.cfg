# Historical royale benchmark reference, not a current deployment configuration.
# Source commit: a9e0104ca25724ac4660a4fc9031620b8a852d40
# Source path: deploy/ubuntu-pc/blob-royale.cfg
# Derived schema migration 2026-09-10: unused [race] track_half_width_world_units becomes road.
# Derived schema migration 2026-09-11: shared movement retains acceleration 400; ceiling 10000.
# Derived schema migration 2026-09-11: existing hazards explicitly retain closing_impact policy.
# Derived schema migration 2026-09-11: required Sandbox return delay, unused by this royale case.
# Derived schema migration 2026-09-12: required [abilities] tap-shield tuning at its defaults.
# Derived schema migration 2026-09-12: required [abilities] charge cooldown, gain and envelope.
# All measured royale workload values remain those of the source; none are overridden.

[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000, cole-ubuntu-pc.colobus-stargazer.ts.net:8444
allowed_origins=https://cole-ubuntu-pc.colobus-stargazer.ts.net:8444
# `tailscale serve` connects from loopback and adds `X-Forwarded-For`, so naming it here is what
# lets the server account every tailnet client as its own principal instead of all of them as one.
# The residual is the one protocol v2 § "Abuse cases" accepts for a single-operator host: any local
# process can set that header itself. See docs/operations/tailnet.md § "Limits behind the proxy".
trusted_proxy_addresses=127.0.0.1

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
# The one nonzero drag in the tree: the deployed match is the playable one, and every fixture,
# test, and benchmark stays at zero so the accepted horizons remain bit-identical.
drag_per_second=2.0

[world]
width_world_units=960
height_world_units=640
player_radius_world_units=10

[spatial_grid]
columns=16
rows=16

# Balance lives here, not in code. `lobby_seat_count` is how many seats the pre-match lobby is
# created with: a match waits until every seat is filled and somebody presses Start, so the count is
# "how many are playing this match" rather than a threshold the arena crosses on its own, which is
# why it sits with the match rather than under `[royale]`. Four seats is the shipped lobby. `bots`
# declares its roster into the first seats, and the server creates a bot for every declared seat,
# so a person who joins a full lobby takes an NPC's seat and a cleared seat retires its bot. Change
# either value and run scripts/reconfigure-tailnet to apply it in seconds; only
# scripts/deploy-tailnet, which re-verifies everything, can change code.
[match]
mode=royale
map=arena-960x640
# The container mounts the configuration directory at /run/blob-royale read-only, and
# scripts/deploy-tailnet installs the map content named below beside the configuration, refusing to
# deploy if that map is absent.
maps_directory=/run/blob-royale/maps
seed=1
lobby_seat_count=4
bots=wanderer:1

[movement]
acceleration_world_units_per_second_squared=400
normal_top_speed_world_units_per_second=10000

# The tap shield's timings, required whatever `[match] mode` names because the ability system
# runs in every room, Sandbox included. These are ADR 0008's initial tuning assumptions, not
# playtested balance: at 400 ticks per second they are 160 protected ticks, of which the first 32
# are the perfect opening, a 360-tick cooldown measured from the same activation, and the 240-tick
# stun a perfect parry hands the attacker. A cooldown shorter than the shield is legal; a perfect
# window longer than the shield is refused at startup.
# Charge's three keys share this section rather than founding a `[charge]` one, and are the same
# kind of value: ADR 0008 tuning plus one engineering guard, never owner-selected balance. The
# 1.2 s cooldown is 480 ticks and, unlike the shield's, must round to a positive count. The
# shield's zero-cooldown exemption is bought by a second gate -- its admission waits for the
# protection to end as well -- and charge has no protection window, so a cooldown rounding to
# zero would admit a burst on every one of the 400 ticks in a second.
# `charge_speed_fraction` is dimensionless and multiplies the *current*
# `normal_top_speed_world_units_per_second` above rather than naming a speed of its own, so
# re-tuning that ceiling re-tunes the burst with it: at the 10000 above it is a 7500 wu/s
# additive burst, and lateral velocity survives it.
# `charge_safety_envelope_speed` bounds the world-units-per-second speed a burst may leave the
# body at; past it the activation is a silent refusal, never a clamped smaller burst. A burst
# here bleeds off against this file's `drag_per_second=2.0`, but decay is not the bound: the
# checked-in `config/blob-royale.cfg` authors `drag_per_second=0`, where a burst is permanent, so
# the envelope is the only thing that bounds repeated charges in every configuration.
# Startup additionally refuses `charge_speed_fraction * 10000` -- the fraction against the highest
# ceiling any room may tune to -- exceeding the envelope, so a charge from rest stays admissible
# whatever a live room does to its ceiling.
[abilities]
shield_duration_seconds=0.4
shield_perfect_window_seconds=0.08
shield_cooldown_seconds=0.9
parry_stun_duration_seconds=0.6
charge_cooldown_seconds=1.2
charge_speed_fraction=0.75
charge_safety_envelope_speed=20000

[royale]
zone_minimum_radius_world_units=60
zone_shrink_seconds=90
elimination_grace_seconds=3
countdown_seconds=5
restart_delay_seconds=8

# The hill's balance. Required whatever `[match] mode` names, so switching the deployment to
# `king_of_the_hill` is the one-line edit above; read only when it names that mode.
[king_of_the_hill]
hill_motion=marker_tour
hill_speed_minimum=20
hill_speed_maximum=70
hill_retarget_minimum_seconds=0.35
hill_retarget_maximum_seconds=1.2
hill_radius_world_units=90
hill_dwell_seconds=12
hill_travel_seconds=4
point_interval_seconds=1
points_to_win=30
contested_hill_scores=false
time_limit_seconds=240
respawn_delay_seconds=2
countdown_seconds=5
restart_delay_seconds=8

# The race's balance, required whatever `[match] mode` names (ADR 0007).
[race]
road=road
checkpoint_radius_world_units=40
respawn_delay_seconds=2
finish_window_seconds=20
time_limit_seconds=240
countdown_seconds=5
restart_delay_seconds=8

# How many rooms this process runs, each playing the `[match]` above on its own thread and its own
# seed. Four is what a wall of lobbies should show and is well inside the budget ADR 0006 measured;
# the compiled ceiling is the protocol's directory limit of eight.
[sandbox]
respawn_delay_seconds=2.0

[lobbies]
count=4

# Objects that cross the arena. A kind is one section and nothing else: no C++ file names a kind and
# no list of kinds is maintained anywhere, so adding a `[hazard.meteor]` here and running
# scripts/reconfigure-tailnet puts a new hazard in the arena in seconds without a rebuild.
#
# Every hazard coasts, because phase 1 drags every dynamic body and the drag factor is geometric: a
# body launched at speed v covers exactly v / drag_per_second before stopping. At the 2.0 above, a
# 260 wu/s comet would die 130 wu into a 1,154 wu diagonal. That is why `drag_scale` exists and why
# the spawner seats hazards at zero -- see the 2026-09-07 amendment to ADR 0003.
#
# Starting values, expected to change after a playtest. Crossing times below assume the arena
# diagonal, which is the longest crossing the geometry admits; most are shorter.

# Small, fast, and fatal. Unit mass and perfect restitution make it an ordinary disc to the physics,
# so it is dangerous because it kills on touch, not because it hits hard. Crosses in about 4.6 s.
[hazard.comet]
radius_world_units=10
mass=1
restitution=1
speed_world_units_per_second=260
spawn_interval_seconds=6
lethal_on_contact=true
contact_effect_policy=closing_impact

# Slow, heavy, and survivable. Forty times a blob's mass, so a player barely deflects it while being
# shoved well off course, and a restitution of 0.35 means the shove is a dull thud rather than a
# bounce. Crosses in about 14 s. This is the object that makes zone position contested without
# making it lethal.
[hazard.boulder]
radius_world_units=26
mass=40
restitution=0.35
speed_world_units_per_second=90
spawn_interval_seconds=20
lethal_on_contact=false
contact_effect_policy=closing_impact
