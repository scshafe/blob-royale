[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000, localhost:8000, [::1]:8000
allowed_origins=http://127.0.0.1:5173, http://localhost:5173
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
# Zero drag preserves every accepted ADR 0003 horizon bit-for-bit: the phase 1 damping factor is
# exactly 1.0 and multiplication by 1.0 is the identity. Only the deployment configuration sets a
# nonzero value.
drag_per_second=0

[world]
width_world_units=960
height_world_units=640
player_radius_world_units=10

[spatial_grid]
columns=16
rows=16

[match]
mode=royale
map=arena-960x640
# Resolved against the process working directory, which for every checked-in workflow is the
# repository root.
maps_directory=maps
seed=1
# How many seats the pre-match lobby is created with: who is playing, not a balance number, so it
# lives beside the match rather than under the mode.
lobby_seat_count=4
bots=

# Select with bots=tactical@steady:1, or through a lobby's NPC menu. Tactical profiles are
# supported in royale, king_of_the_hill, and race; Sandbox has no authored seat identity.
#
# `steady` is the neutral reference and the four sections after it are ADR 0008's named
# personalities. All five are numbers and nothing else: no decision in `blob_controllers` branches
# on a profile's identity, so a personality is authored here or it does not exist. A name is not
# inert, though -- `tactical_seed_identity.hpp` mixes its bytes into the per-bot seed, so renaming a
# section changes that bot's draws without changing one number below.
#
# Two rules every section below keeps, neither of which any bound can enforce: the recovery weight
# is never below the gate weight, because a profile preferring the gate steers at it from off the
# road and never comes back; and no section authors a zero weight on a kind the mode it will be
# seated in produces.
# `objective_weight_shove_setup=0` is the single exemption, because a zero there skips the opponent
# provider outright rather than leaving a candidate nothing can prefer.
[bot_profile.steady]
objective_seek_probability=1
reaction_delay_ticks=80
aim_error=0.05
target_persistence_ticks=400
# One weight per objective kind. Equal positive weights are deliberately no preference at all: the
# utility stage then ranks purely by distance, which is what selection did before it existed, so
# the shipped example changes no behaviour. A personality is authored by making one of these larger
# than the rest, never by editing code.
objective_weight_hill=1
objective_weight_zone=1
objective_weight_race_gate=1
objective_weight_race_recovery=1
# The fifth kind is a shove: the objective is the safe-side standing point behind an opponent, not
# the opponent and not the hazard beyond it, so an equal weight here buys the same distance-ordered
# selection the four above do rather than a bot that hunts.
objective_weight_shove_setup=1
# How much of a screened-but-marginal candidate's penalty this profile ignores: 0 applies it in
# full, 1 cancels it. It can only scale a penalty away, never add score to a dangerous choice.
risk_tolerance=0.5
# 0.2 s at the fixed 400 Hz tick. Escape screening and hill intercept look this far ahead and no
# further; it is a bounded number of fixed-delta steps, never a search.
prediction_horizon_ticks=80
# The corridor a charge is screened over, as a fraction of the arena diagonal and never in world
# units, so one authored number means the same thing on every map. This map's diagonal is about
# 1154 wu, so 0.25 screens 288 wu: past the 253 wu a charge from rest needs to stop at the
# acceleration below and at this file's zero drag, and far short of the 1378 wu a charge already at
# the ceiling would need, which no fraction on this map could cover. Zero is the permissive end, a
# screen that examines nothing and so refuses nothing; one is a refusal to ever charge.
charge_screen_diagonal_fraction=0.25
# 0.06 s of lead on a predicted contact, kept inside the 32 ticks of perfect opening that
# `[abilities] shield_perfect_window_seconds` authors below, because a lead longer than the opening
# can never produce a parry. A bot cannot read that key -- abilities are configured in a library
# controllers do not link -- so keeping the two in step is this file's job. Zero is a real answer:
# that profile never anticipates and raises no speculative shield.
shield_anticipation_ticks=24
# The four personality settings, all authored at the end that reproduces this profile's previous
# behaviour exactly, which is what keeps `steady` the neutral reference. `road_caution_fraction` is
# the exception it cannot be: zero recovers unless the bot is exactly on the centreline, so it is
# refused at startup, and 0.75 is the fraction the race provider used before the key existed.
road_caution_fraction=0.75
# Coast on arrival, bit for bit as before: 1 would spend a full hold's thrust nulling the
# objective's relative motion instead.
arrival_brake_fraction=0
# Score no exposure and abandon no fight. Both zeros leave the utility score exactly as it was.
exposure_preference=0
minimum_opening=0

# Keeper: seeks a hill and brakes on arrival within its full published radius. Stable-interior
# defense remains deferred in ADR 0008. Its zero shove weight skips the opponent provider rather
# than producing a candidate this profile would never pick.
# `minimum_opening=1.0` says the same thing from the other side: no opening is ever good enough.
[bot_profile.keeper]
objective_seek_probability=1
reaction_delay_ticks=40
aim_error=0.02
target_persistence_ticks=400
objective_weight_hill=1
objective_weight_zone=0.5
objective_weight_race_gate=0.25
objective_weight_race_recovery=0.5
objective_weight_shove_setup=0
risk_tolerance=0.25
prediction_horizon_ticks=120
charge_screen_diagonal_fraction=1.0
shield_anticipation_ticks=28
road_caution_fraction=0.75
arrival_brake_fraction=1.0
exposure_preference=0
minimum_opening=1.0

# Bully: fights whoever is nearest. The one personality that needed no new mechanism -- it is
# numbers alone over the shipped pipeline. `charge_screen_diagonal_fraction=0.25` screens about
# 288 wu of this map's 1154 wu diagonal for forward clearance. This is an authored ray screen;
# it does not establish a stopping or recovery path, which remains deferred in ADR 0008.
# `exposure_preference=0` is precisely what separates it from the opportunist below.
[bot_profile.bully]
objective_seek_probability=1
reaction_delay_ticks=60
aim_error=0.05
target_persistence_ticks=200
objective_weight_hill=0.5
objective_weight_zone=0.5
objective_weight_race_gate=0.375
objective_weight_race_recovery=0.5
objective_weight_shove_setup=1
risk_tolerance=0.5
prediction_horizon_ticks=80
charge_screen_diagonal_fraction=0.25
shield_anticipation_ticks=21
road_caution_fraction=0.9
arrival_brake_fraction=0
exposure_preference=0
minimum_opening=0

# Opportunist: the fastest reflexes here and the only profile that scores exposure at all. The
# 20-tick delay is one decision interval at the 20 snapshots a second above -- an opening that
# survives four ignored passes was never an opening -- and `minimum_opening=0.5` is the other half
# of the clause, the value below which it abandons the fight instead of holding its lease.
[bot_profile.opportunist]
objective_seek_probability=1
reaction_delay_ticks=20
aim_error=0.03
target_persistence_ticks=100
objective_weight_hill=0.5
objective_weight_zone=0.625
objective_weight_race_gate=0.5
objective_weight_race_recovery=0.625
objective_weight_shove_setup=0.75
risk_tolerance=0.625
prediction_horizon_ticks=80
charge_screen_diagonal_fraction=0.375
shield_anticipation_ticks=24
road_caution_fraction=0.8
arrival_brake_fraction=0
exposure_preference=1.0
minimum_opening=0.5

# Cautious racer: the lowest risk tolerance in this file and a deliberately non-zero shove weight.
# Its clause is "avoid expensive fights", not "never fight", so it authors a small positive shove
# weight and lets `minimum_opening=0.75` decide which fights are cheap. `road_caution_fraction=0.6`
# sits above the 0.5714 floor -- the `[race] checkpoint_radius_world_units` below over the 70 wu
# half-width of `maps/circuit-960x640` -- under which the recovery threshold would fall inside the
# gate radius and pull a bot off a gate it is already standing in.
[bot_profile.cautious_racer]
objective_seek_probability=1
reaction_delay_ticks=100
aim_error=0.01
target_persistence_ticks=600
objective_weight_hill=0.25
objective_weight_zone=0.5
objective_weight_race_gate=1
objective_weight_race_recovery=1
objective_weight_shove_setup=0.125
risk_tolerance=0.125
prediction_horizon_ticks=200
charge_screen_diagonal_fraction=0.5
shield_anticipation_ticks=32
road_caution_fraction=0.6
arrival_brake_fraction=0
exposure_preference=0.5
minimum_opening=0.75

[movement]
acceleration_world_units_per_second_squared=400
normal_top_speed_world_units_per_second=600

# The tap shield's timings, required whatever `[match] mode` names because the ability system
# runs in every room, Sandbox included. These are ADR 0008's initial tuning assumptions, not
# playtested balance: at 400 ticks per second they are 160 protected ticks, of which the first 32
# are the perfect opening, a 360-tick cooldown measured from the same activation, and the 240-tick
# stun a perfect parry hands the attacker. A cooldown shorter than the shield is legal; a perfect
# window longer than the shield is refused at startup.
# Charge's three keys share this section rather than founding a `[charge]` one, and are the same
# kind of value: ADR 0008 tuning plus one engineering guard, never owner-selected balance. The
# 1.2 s cooldown is 480 ticks and, unlike the shield's, must round to a positive count. The
# shield's zero-cooldown exemption is bought by a second gate -- its admission waits for the
# protection to end as well -- and charge has no protection window, so a cooldown rounding to
# zero would admit a burst on every one of the 400 ticks in a second.
# `charge_speed_fraction` is dimensionless and multiplies the *current*
# `normal_top_speed_world_units_per_second` above rather than naming a speed of its own, so
# re-tuning that ceiling re-tunes the burst with it: at the 600 above it is a 450 wu/s
# additive burst, and lateral velocity survives it.
# `charge_safety_envelope_speed` bounds the world-units-per-second speed a burst may leave the
# body at; past it the activation is a silent refusal, never a clamped smaller burst. This file
# authors `drag_per_second=0`, where a burst never decays at all, so the envelope and not drag is
# what keeps repeated charges from accumulating without limit.
# Startup additionally refuses `charge_speed_fraction * 10000` -- the fraction against the highest
# ceiling any room may tune to -- exceeding the envelope, so a charge from rest stays admissible
# whatever a live room does to its ceiling.
[abilities]
shield_duration_seconds=0.4
shield_perfect_window_seconds=0.08
shield_cooldown_seconds=0.9
parry_stun_duration_seconds=0.6
charge_cooldown_seconds=1.2
charge_speed_fraction=0.75
charge_safety_envelope_speed=20000

[royale]
zone_minimum_radius_world_units=60
zone_shrink_seconds=90
elimination_grace_seconds=3
countdown_seconds=5
restart_delay_seconds=8

# The hill's balance, required whatever `[match] mode` names and read only when it names
# `king_of_the_hill` (`docs/architecture/0007-king-of-the-hill-and-race-modes.md`).
[king_of_the_hill]
hill_motion=marker_tour
hill_speed_minimum=20
hill_speed_maximum=70
hill_retarget_minimum_seconds=0.35
hill_retarget_maximum_seconds=1.2
hill_radius_world_units=90
hill_dwell_seconds=12
hill_travel_seconds=4
point_interval_seconds=1
points_to_win=30
contested_hill_scores=false
time_limit_seconds=240
respawn_delay_seconds=2
countdown_seconds=5
restart_delay_seconds=8

# The race's balance, required whatever `[match] mode` names (ADR 0007).
[race]
road=road
checkpoint_radius_world_units=40
respawn_delay_seconds=2
finish_window_seconds=20
time_limit_seconds=240
countdown_seconds=5
restart_delay_seconds=8

# How many rooms this process runs. One is the single-match server; the deployment runs more.
[sandbox]
respawn_delay_seconds=2.0

[lobbies]
count=1
