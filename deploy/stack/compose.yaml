# Skeleton from scshafe-dev (dev.toml [deploy], DEPLOY-03). The host's
# tools/stack validates it against an allowlist before anything runs: no
# privileges, no host namespaces, binds only under ./state, ports only on
# loopback, images either built here (through the pin) or pinned by digest.
# `dev check` runs the same validator (DEPLOY-04) and lists what it can see
# (DEPLOY-05).
#
# Three containers share the sidecar's network namespace: the simulation server
# (127.0.0.1:8000, /api) and the static web server (127.0.0.1:8081, everything
# else). Both images are built from this repository at the merged commit; the
# configuration and maps are in the server image, so nothing is bind-mounted
# but the node identity.
name: blob-royale

services:
  ts-blob-royale:
    # tailscale/tailscale:v1.104.2 (as parley; TS-2026-013), multi-arch index digest
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    container_name: ts-blob-royale
    init: true
    restart: unless-stopped
    dns: [1.1.1.1]
    security_opt: [no-new-privileges:true]
    environment:
      TS_HOSTNAME: blob-royale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - ./state/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

  blob-royale:
    image: ${BLOB_ROYALE_IMAGE}
    container_name: blob-royale
    init: true
    user: "65532:65532"  # not root; the server writes nothing, so there is no ./state bind
    restart: unless-stopped
    network_mode: service:ts-blob-royale
    depends_on: [ts-blob-royale]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    # The server listens on 127.0.0.1:8000 (deploy/config/blob-royale.cfg) in the
    # sidecar's namespace. Its HTTP routes want the proxy's dialect, one canonical
    # X-Forwarded-For, so the probe speaks it; the image has no curl, so bash's
    # /dev/tcp does the request.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8000 &&
          printf 'GET /api/v1/health/ready HTTP/1.1\r\nHost: 127.0.0.1:8000\r\nX-Forwarded-For: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${BLOB_ROYALE_WEB_IMAGE}
    container_name: blob-royale-web
    init: true
    user: "65532:65532"
    restart: unless-stopped
    network_mode: service:ts-blob-royale
    depends_on: [ts-blob-royale]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    # nginx keeps its pid file and temporary files here (deploy/web/nginx.conf).
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
