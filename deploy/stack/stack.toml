# The stack's data (stack.toml, schema 1). The host's tools/stack reads it as
# data, never as shell, and rejects an unknown key; `dev check` (DEPLOY-03)
# checks the same schema. Secrets are named here and never valued: the owner's
# provisioning places them on the host. Infra's stacks/blob-royale/host.conf
# grants what this file cannot (host paths, loopback ports, groups).
schema = 1

[deploy]
image = "blob-royale"                  # the image built from this repository's Dockerfile
pin = "BLOB_ROYALE_IMAGE"                      # the .env variable stack deploy writes (name:tag)
pin_style = "ref"
dockerfile = "Dockerfile"
# The static web server for the built client: the simulation server serves only /api.
extra_images = ["web:deploy/web/Dockerfile:BLOB_ROYALE_WEB_IMAGE"]
containers = ["blob-royale", "blob-royale-web"]   # all must be ready on the candidate
health = "/api/v1/health/ready"      # probed through the tailnet name (the sidecar adds X-Forwarded-For)
ready_attempts = 20
rollback_services = ["blob-royale", "web"]

[check]
required_health_services = ["blob-royale", "web"]

[backup]
tailscale = true                     # the node identity (always, with a sidecar)
paths = []                           # no app data: the server keeps no state

[env]
required = ["TS_AUTHKEY"]
generated = []
owner = []
