[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000, cole-ubuntu-pc.colobus-stargazer.ts.net:8444
allowed_origins=https://cole-ubuntu-pc.colobus-stargazer.ts.net:8444
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
# The one nonzero drag in the tree: the deployed match is the playable one, and every fixture,
# test, and benchmark stays at zero so the accepted horizons remain bit-identical.
drag_per_second=2.0

[world]
width_world_units=960
height_world_units=640
player_radius_world_units=10

[spatial_grid]
columns=16
rows=16

# Balance lives here, not in code. `bots` and `[royale] lobby_minimum_players` together decide who
# a match waits for: the minimum counts every seated blob, bots included, so a minimum above the bot
# count makes the arena wait for people instead of playing against itself. One bot and a minimum of
# three means the lobby holds until two people have joined, which is what a playtest wants -- nobody
# has to catch a join window between matches. Change either value and run scripts/reconfigure-tailnet
# to apply it in seconds; only scripts/deploy-tailnet, which re-verifies everything, can change code.
[match]
mode=royale
map=arena-960x640
# The container mounts the configuration directory at /run/blob-royale read-only, and
# scripts/deploy-tailnet installs the map content named below beside the configuration, refusing to
# deploy if that map is absent.
maps_directory=/run/blob-royale/maps
seed=1
bots=wanderer:1

[royale]
thrust_max_world_units_per_second_squared=400
zone_minimum_radius_world_units=60
zone_shrink_seconds=90
elimination_grace_seconds=3
lobby_minimum_players=3
countdown_seconds=5
restart_delay_seconds=8
