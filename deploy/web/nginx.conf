# The static server for the built client. It listens on loopback inside the stack's shared network
# namespace (serve.json proxies `/` here), runs as an unprivileged user on a read-only root, and
# keeps its pid and temporary files in the container's tmpfs at /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 127.0.0.1:8081;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    # Vite fingerprints everything under /assets, so it can be cached for good; the page that
    # names the fingerprints must be revalidated on every load.
    location /assets/ {
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ =404;
    }
  }
}
