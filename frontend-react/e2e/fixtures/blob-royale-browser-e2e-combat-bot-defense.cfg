# Step 23 production transport/canvas observation fixture, never a balance claim.
# 20 Hz publications and 400 Hz simulation are unchanged. Broad shield/perfect/stun
# windows allow browser actions to be bracketed by authoritative published ticks.
[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000
allowed_origins=http://127.0.0.1:5173
trusted_proxy_addresses=
[presentation]
