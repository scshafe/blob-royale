# The heavy-hazard browser end-to-end fixture: two browser sessions and one comet that only shoves.
#
# A third configuration rather than a hazard table bolted onto `blob-royale-browser-e2e-royale.cfg`,
# because that flow pins `4 entities and 3 players` in its caption assertion and a hazard is an
# entity: adding one would make that count fluctuate and the flow would be asserting the weather.
# It also wants a wanderer bot as an independent command source, which a seeded-outcome hazard flow
# specifically does not -- a bot that wandered into the drawn crossing would be a third body in a
# geometry chosen for two.
#
# **No bot and exactly three seats: two browsers and the lobby driver.** The field is the two
# browser sessions, which is what lets `e2e-hazard-1920x1280/map.cfg` place one blob on the first
# hazard's path and the other well clear of it and have that stay true. The third seat exists for
# the flow's lobby driver, the session that presses Start through the published wire: since
# protocol 2.4 a room refuses a session past its seat count at the door, so the driver needs a seat
# of its own and takes the map's third marker, well clear of every crossing, for the countdown
# only -- it closes within a frame of `running`, and its blob goes with it. The match cannot leave
# the lobby until all three seats are filled and somebody presses Start, so neither browser is ever
# a mid-match joiner the spawn policy would defer.
#
# **The seed is load-bearing.** `hazard_spawn` is the only reader of the world's generator, so the
# Nth hazard's crossing is a pure function of `seed` and N; `seed=2026` is the seed the map's two
# marker positions were computed against and changing it invalidates them.

[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000
allowed_origins=http://127.0.0.1:5173
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
# **Zero here is now a claim about the blobs, not about the hazard.** Phase 1 applies drag to every
# dynamic body at that body's own declared `drag_scale` (`src/simulation/physics_body.hpp`), and
# `HazardSpawnSystem` seats every hazard at zero, so a comet coasts whatever this line says.
#
# That was not true when this fixture was written, and the history is why `drag_scale` exists.
# Drag then reached every body unconditionally, and because the factor is geometric a body launched
# at `v` under a drag of `d` per second covers exactly `v / d` world units before it stops. A
# hazard therefore had a finite range, and at the royale flow's `drag_per_second=40` this fixture's
# 600 wu/s comet travelled fifteen world units: it never reached the wall it was aimed through, let
# alone the arena. Verified rather than reasoned about -- the same fixture at `drag_per_second=40`
# seated the comet, stalled it 14 wu from its entry point, and despawned it having touched nothing.
#
# It stays zero for what happens *after* the contact rather than before it. Zero is what every
# other fixture in the tree runs at, for the unrelated reason that the ADR 0003 horizons stay
# bit-identical there, and the consequence here is that a deflected blob keeps its new velocity
# instead of settling -- which the spec accounts for with a named budget rather than by pretending
# it comes to rest. Raising it would retune that budget and buy nothing the hazard needs.
drag_per_second=0

[world]
# Must equal the map's bounds: `require_map_matches_published_world` rejects a mismatch, and the
# client draws the published scalars.
width_world_units=1920
height_world_units=1280
player_radius_world_units=20

[spatial_grid]
columns=16
rows=16

[match]
mode=royale
map=e2e-hazard-1920x1280
# Playwright and the server process both run with frontend-react/ as the working directory;
# `BlobRoyaleServerProcess` sets it explicitly rather than inheriting it.
maps_directory=e2e/fixtures/maps
seed=2026
lobby_seat_count=3
bots=

[royale]
thrust_max_world_units_per_second_squared=400
# The zone is deliberately a non-participant here. It starts at the arena's half-diagonal of 1153.8
# wu and contracts to 200 over ten minutes, which is 1.6 wu/s; both spawn markers sit within 420 wu
# of the centre, so no blob can be outside the zone during this flow and the only rule that can
# eliminate anybody is `lethal_hazard`. The grace is long for the same reason: belt and braces on
# an elimination this flow must be able to attribute.
zone_minimum_radius_world_units=200
zone_shrink_seconds=600
elimination_grace_seconds=30
countdown_seconds=1
# Long enough that a match which ends because a hazard removed a player stays ended for the rest of
# the flow. A restart clears the placement list, which is exactly what the lethal assertion reads.
restart_delay_seconds=120

[lobbies]
count=1

# One kind, and adding it cost this section and no C++ (`gameplay/shared/hazard_archetype.hpp`).
#
# The numbers are chosen against the map, not tuned for feel:
#   * radius 30 against a player radius of 20 makes contact a 50 wu question, which the map's
#     marker placement is stated in;
#   * speed 600 wu/s puts the longest crossing this arena admits at 2427.6 / 600 = 4.05 s of life,
#     which is **below** the 8 s spawn interval, so exactly one hazard is ever in the air. That is
#     what keeps the drawn crossing the crossing: two hazards sharing the arena would deflect each
#     other through `variable_impulse` and the first one's path would stop being a function of the
#     seed alone;
#   * mass 200 against a player's unit mass is what makes the deflection visible -- a perfectly
#     elastic head-on contact hands the blob `2 * 600 / (1/200 + 1) = 1194` wu/s, which with no
#     drag is 3 wu of travel per tick, or 1.5 canvas pixels, and does not stop. A displacement of
#     four canvas pixels is therefore reached within three ticks of contact and there is no
#     intermediate state a poll could catch halfway.
[hazard.crimson_comet]
radius_world_units=30
mass=200
restitution=1
speed_world_units_per_second=600
spawn_interval_seconds=8
lethal_on_contact=false
