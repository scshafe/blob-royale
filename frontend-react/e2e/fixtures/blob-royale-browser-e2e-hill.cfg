# The king-of-the-hill browser end-to-end fixture: one browser session and one `hill_seeker` the
# flow seats through the lobby's bot menu, on a two-seat lobby with no configured bot.
#
# Its own configuration for the same reason the royale flow has one: this world is decided by a
# bot reaching a hill, which wants bounded speed (`drag_per_second=40`, the 9 wu/s cap the royale
# fixture derives) and a threshold small enough to be reached inside one test budget. See
# `maps/e2e-hill-1920x1280/map.cfg` for where the three markers sit and why.
#
# Running it also means the gate resolves the third registered mode from configuration end to end,
# and seats the third registered bot from the menu the welcome publishes.

[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000
allowed_origins=http://127.0.0.1:5173
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
# The royale fixture's cap: 400 wu/s² against 40/s holds every body at 9 wu/s, so the seeker's
# five-second approach is arithmetic and the browser's untouched blob cannot reach the hill.
drag_per_second=40

[world]
# Must equal the map's bounds: `require_map_matches_published_world` rejects a mismatch, and the
# client draws the published scalars.
width_world_units=1920
height_world_units=1280
player_radius_world_units=20

[spatial_grid]
columns=16
rows=16

[match]
mode=king_of_the_hill
map=e2e-hill-1920x1280
# Playwright and the server process both run with frontend-react/ as the working directory;
# `BlobRoyaleServerProcess` sets it explicitly rather than inheriting it.
maps_directory=e2e/fixtures/maps
seed=20260909
# Two seats and no configured bot: the browser holds one and fills the other from the lobby's bot
# menu, which is the client-side path a new registered bot has to be reachable through. The map
# declares exactly two spawn markers, so `require_lobby_fits_map` accepts exactly this number.
lobby_seat_count=2
bots=

[royale]
thrust_max_world_units_per_second_squared=400
zone_minimum_radius_world_units=200
zone_shrink_seconds=90
elimination_grace_seconds=3
countdown_seconds=1
restart_delay_seconds=8

[king_of_the_hill]
thrust_max_world_units_per_second_squared=400
# 150 wu: 150 CSS pixels at the local camera's scale, and 45 wu short of the seeker's marker.
hill_radius_world_units=150
# One `hill` marker, so the tour has one stop and the hill never moves; the durations are the
# shipped values and are inert.
hill_dwell_seconds=12
hill_travel_seconds=4
# A point a second and three to win: the seeker decides the match about three seconds after it is
# holding the hill with the match running. The browser's blob is nowhere near, so nothing contests.
point_interval_seconds=1
points_to_win=3
contested_hill_scores=false
time_limit_seconds=240
respawn_delay_seconds=2
countdown_seconds=1
restart_delay_seconds=8

[race]
thrust_max_world_units_per_second_squared=400
track_half_width_world_units=70
checkpoint_radius_world_units=40
respawn_delay_seconds=2
finish_window_seconds=20
time_limit_seconds=240
countdown_seconds=5
restart_delay_seconds=8

[lobbies]
count=1
