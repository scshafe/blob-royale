# The race browser proof: one person seats one racer, drives off the road after taking gate 1,
# returns to that checkpoint, and watches the bot finish. Marker derivations live in the map.

[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000
allowed_origins=http://127.0.0.1:5173
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
# With thrust 400, the accepted tick kernel holds 9 wu/s, matching the royale and hill fixtures.
drag_per_second=40

[world]
width_world_units=1920
height_world_units=1280
player_radius_world_units=20

[spatial_grid]
columns=16
rows=16

[match]
mode=race
map=e2e-race-1920x1280
maps_directory=e2e/fixtures/maps
seed=20260909
lobby_seat_count=2
bots=

[royale]
thrust_max_world_units_per_second_squared=400
zone_minimum_radius_world_units=200
zone_shrink_seconds=90
elimination_grace_seconds=3
countdown_seconds=1
restart_delay_seconds=8

[king_of_the_hill]
thrust_max_world_units_per_second_squared=400
hill_radius_world_units=150
hill_dwell_seconds=12
hill_travel_seconds=4
point_interval_seconds=1
points_to_win=3
contested_hill_scores=false
time_limit_seconds=240
respawn_delay_seconds=2
countdown_seconds=1
restart_delay_seconds=8

[race]
thrust_max_world_units_per_second_squared=400
track_half_width_world_units=70
checkpoint_radius_world_units=60
# Two seconds makes the absence and published return timer observable at 20 snapshots/second.
respawn_delay_seconds=2
# The bot travels (740 - 450) wu at 9 wu/s, about 32.3 s, and then this window decides the match.
finish_window_seconds=4
time_limit_seconds=180
countdown_seconds=1
# Retain the ended standings while the browser inspects the winner and course.
restart_delay_seconds=30

[lobbies]
count=1
