# The two-room browser end-to-end fixture: two rooms, two seats each, no configured bot.
#
# A fourth configuration rather than `[lobbies] count=2` on the royale fixture, because the two
# flows want different lobbies. The royale flow wants a bot already in a seat when the first browser
# arrives and a fourth seat to shrink away; this flow wants both rooms to start empty, so that a
# browser fills a seat with a bot through the lobby's own menu and the directory is read at every
# stage: empty, one room occupied, both matches running, and one room back in its lobby after the
# only person in it left.
#
# **Two seats per room and no bot.** A person takes the first seat on admission and seats a bot in
# the second through the client, so Start is disabled with a reason on screen until the bot exists
# and enabled the moment it does. The map is the royale flow's, with four markers, so
# `require_lobby_fits_map` accepts two seats and would accept up to four.
#
# **The restart delay is short.** When the last person leaves a running match the control loop
# retires the room's bots, the match ends, and the machine walks `ended -> lobby` after
# `restart_delay_seconds`, where the reconciliation reseats the declared bot. Four seconds is what
# the flow waits to see room 1 listed as "In the lobby" again; the deployed eight would only make
# the same observation slower.

[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000
allowed_origins=http://127.0.0.1:5173
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
drag_per_second=40

[world]
width_world_units=1920
height_world_units=1280
player_radius_world_units=20

[spatial_grid]
columns=16
rows=16

[match]
mode=royale
map=e2e-royale-1920x1280
maps_directory=e2e/fixtures/maps
seed=20260909
lobby_seat_count=2
bots=

[movement]
acceleration_world_units_per_second_squared=400
normal_top_speed_world_units_per_second=10000

[royale]
zone_minimum_radius_world_units=200
zone_shrink_seconds=90
elimination_grace_seconds=3
countdown_seconds=1
restart_delay_seconds=4

[king_of_the_hill]
hill_motion=marker_tour
hill_speed_minimum=20
hill_speed_maximum=70
hill_retarget_minimum_seconds=0.35
hill_retarget_maximum_seconds=1.2
hill_radius_world_units=90
hill_dwell_seconds=12
hill_travel_seconds=4
point_interval_seconds=1
points_to_win=30
contested_hill_scores=false
time_limit_seconds=240
respawn_delay_seconds=2
countdown_seconds=5
restart_delay_seconds=8

[race]
road=road
checkpoint_radius_world_units=40
respawn_delay_seconds=2
finish_window_seconds=20
time_limit_seconds=240
countdown_seconds=5
restart_delay_seconds=8

[lobbies]
count=2
