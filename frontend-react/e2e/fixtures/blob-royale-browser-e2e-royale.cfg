# The royale browser end-to-end fixture: two browser sessions, one wanderer bot, and a fourth seat
# the flow shrinks away through the lobby's seat-count control before it presses Start.
#
# A second configuration rather than a change to `blob-royale-browser-e2e.cfg`, because the two
# flows want opposite worlds. The recovery flow needs a world whose published caption is identical
# before and after a server restart, which royale is not: restarting a royale process restarts a
# match. This one needs bounded speed, which the recovery flow must not have -- every existing
# fixture runs at `drag_per_second=0` so the ADR 0003 horizons stay bit-identical.
#
# Running both also means the gate resolves both registered modes from configuration end to end.

[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000
allowed_origins=http://127.0.0.1:5173
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
# Nonzero here and only here. With the thrust maximum below it caps every body at 9 wu/s, which is
# what makes "the bot cannot reach the blob that must not move" arithmetic instead of a hope. No
# accepted determinism fixture runs on this file.
drag_per_second=40

[world]
# Must equal the map's bounds: `require_map_matches_published_world` rejects a mismatch, and the
# client draws the published scalars.
width_world_units=1920
height_world_units=1280
player_radius_world_units=20

[spatial_grid]
columns=16
rows=16

[match]
mode=royale
map=e2e-royale-1920x1280
# Playwright and the server process both run with frontend-react/ as the working directory;
# `BlobRoyaleServerProcess` sets it explicitly rather than inheriting it.
maps_directory=e2e/fixtures/maps
seed=20260907
# Four seats: one bot, two browsers, and one more. The fourth seat is what keeps Start disabled
# with a reason on screen after both browsers have connected, which the flow asserts before it
# shrinks the lobby to the three seats that are taken through the seat-count control -- exactly
# where the control floors -- and presses Start. The match cannot start until every seat is filled
# and somebody presses Start, and the flow presses it after the second browser has connected, so
# neither browser is ever a mid-match joiner and the spawn policy never defers one. The deferral
# rule is real and correct; a browser flow that raced it would be neither.
#
# The map declares exactly four spawn markers, so `require_lobby_fits_map` accepts exactly this
# number and rejects a larger one at startup.
lobby_seat_count=4
bots=wanderer:1

[royale]
thrust_max_world_units_per_second_squared=400
zone_minimum_radius_world_units=200
zone_shrink_seconds=90
elimination_grace_seconds=3
countdown_seconds=1
restart_delay_seconds=8

[king_of_the_hill]
thrust_max_world_units_per_second_squared=400
hill_radius_world_units=90
hill_dwell_seconds=12
hill_travel_seconds=4
point_interval_seconds=1
points_to_win=30
contested_hill_scores=false
time_limit_seconds=240
respawn_delay_seconds=2
countdown_seconds=5
restart_delay_seconds=8

[race]
thrust_max_world_units_per_second_squared=400
road=road
checkpoint_radius_world_units=40
respawn_delay_seconds=2
finish_window_seconds=20
time_limit_seconds=240
countdown_seconds=5
restart_delay_seconds=8

[lobbies]
count=1
