# Verification-only hill match: two configured tactical profiles and one untouched browser.
# The only profile difference is seek probability: the two sections are byte-identical below it,
# including the weights and the three combat settings, so no selection or combat setting can move
# the spec's motionless pins. The four non-shove objective weights are equal, which is no
# preference at all among them, so the utility stage ranks this fixture's single hill candidate
# exactly as nearest-first did.
#
# Combat is authored off in *both* sections, not only in the coaster's, and that is load-bearing.
# The spec pins the coaster and the browser to 1e-9 on position, velocity AND acceleration and pins
# the seeker under 30 wu of displacement, while a charge writes velocity directly: at this file's
# 10000 wu/s ceiling and the 0.75 charge fraction below, one burst is 7500 wu/s against a 1e-9
# tolerance. `objective_seek_probability=0` gates thrust only and is no protection from it.
# Each of the three is authored at its inert end rather than merely low, and the shove weight is
# the one carrying the load: a burst is only ever aimed at a *selected* shove candidate
# (`tactical_controller.cpp`), and `objective_weight_shove_setup=0` leaves such a candidate a zero
# preference term, so at this fixture's spawn distances it cannot outscore the positively weighted
# hill the spec measures approach to (`tactical_candidate_score`) and no burst is ever aimed.
# `charge_screen_diagonal_fraction=1.0` is the strictest screen a profile can author and stands
# behind that; `shield_anticipation_ticks=0` answers "not closing" before it looks at an opponent
# at all, so no shield is raised either -- and a shield writes no velocity in any case.
# All bodies start at rest, no hazards exist, and one hill marker never retargets, so the hill's
# published velocity is zero and the prediction horizon moves the aimed-at point by nothing.
# The smoke reads running ticks 800..1200 (2..3 seconds).
# At 400 wu/s^2 and drag 40/s, held go stays below 10 wu/s: less than 30 wu of travel in that window,
# far short of contact with another spawn or arrival at the nearest hill edge 45 wu away.
[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000
allowed_origins=http://127.0.0.1:5173
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
drag_per_second=40

[world]
width_world_units=1920
height_world_units=1280
player_radius_world_units=20

[spatial_grid]
columns=16
rows=16

[match]
mode=king_of_the_hill
map=e2e-tactical-movement-1920x1280
maps_directory=e2e/fixtures/maps
seed=20260911
lobby_seat_count=3
bots=tactical@seeker:1,tactical@coaster:1

[bot_profile.seeker]
objective_seek_probability=1
reaction_delay_ticks=0
aim_error=0
target_persistence_ticks=400
# Equal positive weights are no preference, so selection stays distance-ordered. The shove weight
# is the exception and is zero on purpose; see the file header.
objective_weight_hill=1
objective_weight_zone=1
objective_weight_race_gate=1
objective_weight_race_recovery=1
objective_weight_shove_setup=0
risk_tolerance=0.5
prediction_horizon_ticks=80
charge_screen_diagonal_fraction=1.0
shield_anticipation_ticks=0

[bot_profile.coaster]
objective_seek_probability=0
reaction_delay_ticks=0
aim_error=0
target_persistence_ticks=400
# Identical to the seeker's, on purpose. See the file header.
objective_weight_hill=1
objective_weight_zone=1
objective_weight_race_gate=1
objective_weight_race_recovery=1
objective_weight_shove_setup=0
risk_tolerance=0.5
prediction_horizon_ticks=80
charge_screen_diagonal_fraction=1.0
shield_anticipation_ticks=0

[movement]
acceleration_world_units_per_second_squared=400
normal_top_speed_world_units_per_second=10000

[abilities]
shield_duration_seconds=0.4
shield_perfect_window_seconds=0.08
shield_cooldown_seconds=0.9
parry_stun_duration_seconds=0.6
charge_cooldown_seconds=1.2
charge_speed_fraction=0.75
charge_safety_envelope_speed=20000

[royale]
zone_minimum_radius_world_units=200
zone_shrink_seconds=90
elimination_grace_seconds=3
countdown_seconds=1
restart_delay_seconds=8

[king_of_the_hill]
hill_motion=marker_tour
hill_speed_minimum=20
hill_speed_maximum=70
hill_retarget_minimum_seconds=0.35
hill_retarget_maximum_seconds=1.2
hill_radius_world_units=150
hill_dwell_seconds=12
hill_travel_seconds=4
point_interval_seconds=1
points_to_win=30
contested_hill_scores=false
time_limit_seconds=240
respawn_delay_seconds=2
countdown_seconds=1
restart_delay_seconds=8

[race]
road=road
checkpoint_radius_world_units=40
respawn_delay_seconds=2
finish_window_seconds=20
time_limit_seconds=240
countdown_seconds=5
restart_delay_seconds=8

[sandbox]
respawn_delay_seconds=2.0

[lobbies]
count=1
