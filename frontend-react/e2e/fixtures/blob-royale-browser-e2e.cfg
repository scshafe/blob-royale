[server]
bind_address=127.0.0.1
port=8000
allowed_hosts=127.0.0.1:8000
allowed_origins=http://127.0.0.1:5173
trusted_proxy_addresses=

[presentation]
snapshots_per_second=20

[simulation]
ticks_per_second=400
drag_per_second=0

[world]
width_world_units=960
height_world_units=640
player_radius_world_units=10

[spatial_grid]
columns=16
rows=16

[match]
# Sandbox, not royale: this fixture seeds two entities and asserts they keep rendering across a
# server restart, and royale would legitimately start a match on them, shrink the zone, and
# eliminate both. The royale flow got its own configuration and its own map instead --
# `blob-royale-browser-e2e-royale.cfg` -- so this file keeps `drag_per_second=0` and a world that
# looks the same before and after a restart.
mode=sandbox
map=arena-960x640
# Playwright runs from frontend-react/, so the repository's map directory is one level up.
maps_directory=../maps
seed=1
# Sandbox declares a lobby it never uses: the key is required whatever `[match] mode` names, and a
# mode whose objective never starts ignores the roster exactly as it ignores every `[royale]` key.
lobby_seat_count=2
bots=

[royale]
thrust_max_world_units_per_second_squared=400
zone_minimum_radius_world_units=60
zone_shrink_seconds=90
elimination_grace_seconds=3
countdown_seconds=5
restart_delay_seconds=8

[king_of_the_hill]
thrust_max_world_units_per_second_squared=400
hill_radius_world_units=90
hill_dwell_seconds=12
hill_travel_seconds=4
point_interval_seconds=1
points_to_win=30
contested_hill_scores=false
time_limit_seconds=240
respawn_delay_seconds=2
countdown_seconds=5
restart_delay_seconds=8

[race]
thrust_max_world_units_per_second_squared=400
track_half_width_world_units=70
checkpoint_radius_world_units=40
respawn_delay_seconds=2
finish_window_seconds=20
time_limit_seconds=240
countdown_seconds=5
restart_delay_seconds=8

[lobbies]
count=1
