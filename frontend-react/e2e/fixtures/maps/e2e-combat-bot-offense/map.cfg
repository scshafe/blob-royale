# Two stationary, equal-mass player bodies; no static body can add an impulse.
[map]
name=e2e-combat-bot-offense
display_name=E2E Combat bot-offense
[bounds]
width_world_units=1920
height_world_units=1280
[terrain]
ground=solid

# Bot x740 reaches target contact x860 before support ends x940. The target
# at x900 has forty units to the hole; its received charge momentum at drag2
# carries it across. Full-disc spawn clearance remains twenty units.
[terrain.hole.target_pit]
center_x_world_units=1000
center_y_world_units=640
radius_world_units=60
