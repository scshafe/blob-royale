# A second safe, stationary browser at x1600 keeps the hill round alive during body return.
# Step 23 authored endpoint-miss geometry; see the adjacent browser configuration.
[map]
name=e2e-dynamic-hill
display_name=E2E Dynamic hill

[bounds]
width_world_units=1920
height_world_units=1280

[terrain]
ground=solid

# Both the start x=300 and unconstrained endpoint x=318.65625 are supported.
[terrain.hole.charge_gap]
center_x_world_units=310
center_y_world_units=640
radius_world_units=2

# The hill starts over a broad dangerous region and roams through it; it owns no body.
# Its 250 wu scoring radius also covers the small charge gap while early observations run.
[terrain.hole.hill_void]
center_x_world_units=310
center_y_world_units=800
radius_world_units=80
