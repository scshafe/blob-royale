# canonical: e2e_hazard_map -- the browser end-to-end hazard arena.
#
# Not a balanced arena. Its first two spawn markers are placed against one specific drawn crossing
# so that `blobRoyaleBrowserHazard.spec.ts` can assert a *seeded outcome* rather than wait for a
# random hazard to eventually arrive, which would be a flake generator rather than a test. The third
# marker is the lobby driver's: a session is sent its welcome only once it has a body, and the
# driver that presses Start has to read the lobby it is pressing for, so it needs a marker of its
# own -- the two browsers hold the other two. Its blob sits there through the one-second countdown
# and is destroyed when the driver leaves, within a frame of `running`, which is before any hazard
# seated in that match could have crossed 60 wu of arena. It is 667 wu clear of the first crossing
# and 778 wu from the nearer of the two markers that matter.
#
# **How the two points were chosen.** `hazard_spawn` is the only reader of `GameWorld::random()` in
# the tree, and it takes exactly three draws per hazard -- the entry edge, the point along it, and
# the point on the opposite edge -- so the geometry of the Nth hazard of a match is a pure function
# of `[match] seed` and N alone, independent of which tick the match happened to start running on.
# For `seed=2026` in this arena the first hazard enters through the left edge and sweeps the ray
#
#     start (-60, 603.683051445) heading (0.991594866, 0.129381693), 2056.275 wu long
#
# where the start is the entry point pushed `2 * radius` outside the wall it enters through. Then:
#
#   * `spawn` marker 0 sits **exactly on that ray**, 706 wu along it, so the first hazard of every
#     match reaches it 1.177 s after being seated and passes through the seated blob's centre. The
#     nine decimal places are the point itself, not a rounding of it.
#   * `spawn` marker 1 sits **549.6 wu away from marker 0 and 503 wu clear of that same ray**, and
#     484 wu clear of the second hazard's. Contact needs the two centres within
#     `hazard_radius + player_radius = 30 + 20 = 50` wu, so the second blob is clear by an order of
#     magnitude and stays clear for the first twelve crossings this seed draws (minimum 125.6 wu).
#
# That asymmetry is the test: one blob is hit and the other is not, so an assertion that both moved
# or that neither did fails, and the spec never has to know which browser session was seated where.
# The rotation counter seats the first browser at marker 0, the second at marker 1, and the driver,
# which connects last, at marker 2.
#
# Both markers sit within 420 wu of the arena centre while the zone starts at 1153.8 wu and
# `[royale] zone_shrink_seconds=600` contracts it by 1.6 wu/s, so neither blob can be outside the
# zone within any plausible run of the flow and no elimination the spec observes can be the zone's.
#
# Both bounds exceed the client's maximum 960x640 CSS-pixel viewport. A local camera retains one
# CSS pixel per world unit; the test removes its observed boundary translation to compare motion.

[map]
name=e2e-hazard-1920x1280
display_name=E2E Hazard 1920x1280

[bounds]
width_world_units=1920
height_world_units=1280
