# trial, kind, speed, and the three geometry draws. Its ray starts at
# (1980,571.0521001238283), heading(-0.978470655962127,0.20638598649386244).
# Marker0 sits706wu along that ray. Contact radius50 gives first contact1.093333s
# after birth; sampled lifetime1389ticks is3.4725s. Marker1 is556.339wu clear of
# the ray. The next birth is eligible trial5239,11.7225s after the first.
# With elastic wall folds, the deflected blob cannot reach marker1 until about
# 16.375s after contact, beyond the test's retained8s isolation budget.
# These are deterministic fixture calculations; production browser assertions verify
# contact, displacement/placement, and the untouched peer. Mean interval alone supplies
# neither a maximum wait nor a bound of one active object.
