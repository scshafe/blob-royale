# canonical: e2e_hill_map -- the browser end-to-end king-of-the-hill arena.
#
# Not a balanced arena. One `hill` marker at the centre and two `spawn` markers placed so that
# `blobRoyaleBrowserHill.spec.ts` observes a *seeded outcome* rather than a race:
#
#   * `spawn` marker 0 seats the browser, 660 wu left of the hill's centre and 510 wu clear of its
#     150 wu edge. The browser presses nothing, so its blob never enters the hill and never
#     contests it; at the fixture's 9 wu/s cap it could not get there inside 56 s of held thrust
#     anyway, and the flow is decided long before that.
#   * `spawn` marker 1 seats the `hill_seeker` the flow chooses from the lobby's bot menu, 195 wu
#     right of the centre: 45 wu outside the edge, which is five seconds of travel at the cap. It
#     heads for the centre from the moment it is seated, holds there, and scores a point a second
#     until the threshold of three decides the match.
#
# Exactly two `spawn` markers, so `[match] lobby_seat_count=2` is both the ceiling the mode accepts
# and the declared lobby. The bounds are twice the shipped arena so the client's 960x640 canvas
# maximum yields an exact 0.5 projection scale: the hill is drawn at canvas (480, 320) with radius
# 75, and every recorded canvas coordinate is exactly half its world coordinate.

[map]
name=e2e-hill-1920x1280
display_name=E2E Hill 1920x1280

[bounds]
width_world_units=1920
height_world_units=1280
