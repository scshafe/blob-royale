# canonical: e2e_race_map -- the browser proof of course drawing, checkpoint return, and finishing.
#
# A straight horizontal road runs from (300,640) to (900,640). Its half-width is 70, so the
# browser's center is out of bounds once y > 710; the radius of its body is not part of that rule.
# Gates at (400,640), (640,640), and (800,640) have radius 60. Both grid seats start inside gate 1:
# the browser at (400,670) is 30 wu from its center, and the racer at (450,640) is 50 wu away.
# Their mutual separation sqrt(50^2 + 30^2) is greater than two player radii (40), so no spawn
# overlaps and the bot drives away from the browser along +x.
#
# The browser first takes gate 1, then holds +y for about (710 - 670)/9 = 4.45 s. Two seconds after
# leaving the road it returns at rest to the gate center (400,640), not its grid seat (400,670).
# At the exact 0.5 world-to-canvas scale, the displayed name moves from (200,349) on the grid to
# (200,334) at the checkpoint: center y plus the 10 px body radius and 4 px label gap.
#
# The racer enters the last gate at x=740 after (740 - 450)/9 = 32.23 s plus its initial acceleration.
# Both remaining gates lie beyond the browser's still x=400, so only the racer can finish. The
# four-second finish window then decides the match; the browser observes both the filled standings
# while running and the final result. No obstacles or hazards can influence this outcome.

[map]
name=e2e-race-1920x1280
display_name=E2E Race 1920x1280

[bounds]
width_world_units=1920
height_world_units=1280
