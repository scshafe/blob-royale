# canonical: e2e_royale_map -- the browser end-to-end royale arena.
#
# Not a balanced arena. Its first three spawn markers exist to make one property of
# `blobRoyaleBrowserRoyaleMatch.spec.ts` provable instead of probable: the wanderer bot is an
# independent command source, so a flow that asserts "a thrust moved one blob and no other" is only
# deterministic while the bot cannot physically reach the blob it must not move.
#
#   * exactly four `spawn` markers, so every seated entity is at a known point whichever way the
#     rotation counter assigns them, and `[royale] lobby_seat_count=4` is a lobby whose full field
#     the arena can actually seat -- `RoyaleMode::validate_map` rejects a seat count above the
#     marker count at startup, so four is simultaneously the ceiling and the declared lobby;
#   * the first three markers, which seat the bot and the two browsers, have a minimum pairwise
#     separation of 1000 wu, against a contact distance of 2r = 40 wu; the fourth seats the lobby
#     driver's own blob for the countdown only, 860 wu from its nearest neighbour, and the driver
#     leaves -- taking its blob with it -- before the match is a second old;
#   * `[simulation] drag_per_second=40` against
#     `[royale] thrust_max_world_units_per_second_squared=400` caps every body at
#     `a(1 - drag*dt)/drag = 9 wu/s`, and no collision can raise it (equal-mass exchange swaps
#     velocities and a wall fold preserves speed).
#
# 960 wu of closing distance at 9 wu/s is 106 s of continuous, perfectly aimed travel. The spec
# refuses to make the claim past 90 s of elapsed wall time and says so by name.
#
# Both bounds exceed the client's maximum 960x640 CSS-pixel viewport. A local camera retains one
# CSS pixel per world unit; the test removes its observed boundary translation to compare motion.

[map]
name=e2e-royale-1920x1280
display_name=E2E Royale 1920x1280

[bounds]
width_world_units=1920
height_world_units=1280
