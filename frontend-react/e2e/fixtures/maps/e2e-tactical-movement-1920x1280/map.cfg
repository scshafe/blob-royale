# Isolated movement smoke map. Preserves the existing hill fixture's two spawns and central hill,
# adding one third spawn 460 wu below the hill. Spawn assignment is observed, not assumed: the
# browser and bots may submit body requests in different orders. Every spawn is outside the hill
# and all pairs are over 499 wu apart, so the first 3 running seconds isolate propulsion from contact.
# One marker_tour hill target stays fixed. Solid terrain, no static bodies, no hazard declarations.
[map]
name=e2e-tactical-movement-1920x1280
display_name=E2E Tactical Movement 1920x1280

[bounds]
width_world_units=1920
height_world_units=1280

[terrain]
ground=solid
