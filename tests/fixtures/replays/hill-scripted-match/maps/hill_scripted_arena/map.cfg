# The two spawn points are the two stops of the hill's tour, 320 wu apart, so player 1 begins on
# the hill and player 2 waits at the far stop for it to arrive. The travel of 32 ticks makes every
# glide fraction k/32 exact in binary64 and every centre x = 400 + 10k exact, so the ticks below
# are derived rather than observed.

[map]
name=hill_scripted_arena
display_name=hill_scripted_arena

[bounds]
width_world_units=960
height_world_units=640

[terrain]
ground=solid
