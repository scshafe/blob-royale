# Racer 1 starts on the centreline; racer 2 stays ten wu below it, outside every radius-five
# gate but within the width-20 corridor. Gates are ten, twenty and thirty wu from the grid.

[map]
name=race_finish_window
display_name=race_finish_window

[bounds]
width_world_units=960
height_world_units=640

[terrain]
ground=corridors

[terrain.corridor.road]
half_width_world_units=20
points_world_units=100,320;200,320
