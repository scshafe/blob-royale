# All scenarios use the accepted 960x640 arena, canonical 400 Hz, and an 80-wu grid cell
# (960/12=640/8=80). Radius one isolates steering from contact; zero drag makes the
# discrete-motion formula in commands.csv the oracle. Seed one names the fixed replay.
[match]
mode=race
map=race_finish_window
seed=1
tick_count=58
lobby_seat_count=2

[simulation]
player_radius_world_units=1
ticks_per_second=400
spatial_grid_columns=12
spatial_grid_rows=8
drag_per_second=0

# Width twenty admits each lane; radius five defines the gate-entry inequalities.
# Respawn and finish window are eight ticks each. Countdown/restart zero isolate the
# lifecycle's tick boundaries. The horizon and clock are derived in commands.csv.
[race]
thrust_max_world_units_per_second_squared=4000
road=road
checkpoint_radius_world_units=5
respawn_delay_seconds=0.02
finish_window_seconds=0.02
time_limit_seconds=0.12
countdown_seconds=0
restart_delay_seconds=0
