# Symmetric lanes are three wu above/below the straight centreline and six wu apart,
# clear of the radius-one bodies. A radius-five gate at dy=3 has horizontal reach four:
# sqrt(5^2-3^2)=4, so the three entry displacements are 6,16,26 from x=100.

[map]
name=race_shared_finish
display_name=race_shared_finish

[bounds]
width_world_units=960
height_world_units=640

[terrain]
ground=corridors

[terrain.corridor.road]
half_width_world_units=20
points_world_units=100,320;200,320
